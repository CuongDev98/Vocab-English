<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VocabSnap – Học từ vựng từ ảnh</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--wn:#d97706;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--cd:#1a1d27;--tx:#eef0f6;--mu:#9aa3b2;--bd:#2a2f3d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 14px}h2{margin:.2em 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.center{text-align:center}.mu,small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;color:var(--mu);font-size:13px}.stat b{display:block;font-size:26px;color:var(--tx)}
.btn,.btn2{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;margin:10px 0;cursor:pointer;background:var(--pr);color:#fff}
.btn2{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.big{font-size:30px;font-weight:700;margin:8px 0;word-break:break-word}.big2{font-size:24px;font-weight:600}
.btn.big{font-size:20px;padding:20px;margin:14px 0;font-weight:700}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px;margin:4px 0}
textarea{min-height:90px}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0;flex:1}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.top{display:flex;align-items:center;gap:10px}
.x,.spk,.lnk{background:none;border:0;font-size:20px;cursor:pointer;color:var(--tx)}.lnk{font-size:14px;color:var(--mu);width:100%;margin-top:8px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font-size:16px}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.15)}
.fb{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);border-left:5px solid var(--bad)}.fb.ok{border-color:var(--ok)}.fb.near{border-color:var(--wn)}
.mic{width:100%;padding:22px;font-size:18px;border-radius:50px;border:0;background:var(--pr);color:#fff}
.ipa{color:var(--mu);font-family:"Segoe UI",serif}
.w{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}
.dot{display:inline-block;width:9px;height:9px;border-radius:9px;margin-right:6px}
.dr{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}.dr.fl{border-color:var(--wn);background:rgba(217,119,6,.1)}
.dr input[type=checkbox]{width:24px;flex:none}.warn{color:var(--wn)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pv img{height:70px;border-radius:8px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:11px;color:var(--mu)}#nav button b{display:block;font-size:20px;font-weight:400}#nav .on{color:var(--pr);font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
dialog{border:0;border-radius:16px;width:92%;max-width:480px;background:var(--cd);color:var(--tx)}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<dialog id="dlg">
 <h3>Từ vựng</h3>
 <input id="f-en" placeholder="English"><input id="f-ipa" placeholder="Phiên âm IPA"><input id="f-vi" placeholder="Nghĩa tiếng Việt">
 <input id="f-pos" placeholder="Từ loại (n, v, adj, phr...)"><input id="f-ex" placeholder="Ví dụ (EN – VI)">
 <input id="f-set" list="sets" placeholder="Bộ từ vựng"><datalist id="sets"></datalist>
 <div class="row"><button class="btn2" onclick="$('#dlg').close()">Hủy</button><button class="btn" onclick="saveW()">Lưu</button></div>
 <button class="lnk" id="del" onclick="delW()">🗑 Xóa từ này</button>
</dialog>
<script>
'use strict';
/* ================= Utils ================= */
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,now=()=>Date.now(),uid=()=>Math.random().toString(36).slice(2,9)+now().toString(36);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const sel=(o,v)=>o.map(([k,l])=>`<option value="${E(k)}" ${k==v?'selected':''}>${E(l)}</option>`).join('');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2600)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}

/* ================= Storage (IndexedDB, fallback: memory) ================= */
const ST=['words','sets','hist'];
const DB={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open('vocabsnap',1);q.onupgradeneeded=()=>ST.forEach(s=>q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>{DB.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 tx(s,m,f){return new Promise(r=>{if(!DB.db)return r([]);try{const t=DB.db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r([])}catch(e){r([])}})},
 all:s=>DB.tx(s,'readonly',o=>o.getAll()),put:(s,v)=>DB.tx(s,'readwrite',o=>o.put(v)),
 del:(s,id)=>DB.tx(s,'readwrite',o=>o.delete(id)),clear:s=>DB.tx(s,'readwrite',o=>o.clear())};
const S={words:[],sets:[],hist:[],cfg:Object.assign({n:20,scope:'all',newPerDay:10,rate:.9,recent:[]},JSON.parse(ls.g('vs_cfg')||'{}'))};
const saveCfg=()=>ls.s('vs_cfg',JSON.stringify(S.cfg));

/* ================= Vocabulary model + Spaced Repetition (Leitner) ================= */
const mkWord=o=>({id:uid(),en:'',ipa:'',vi:'',pos:'',ex:'',set:'',added:now(),box:0,ok:0,bad:0,last:0,next:0,flag:false,...o});
const INT=[0,1,3,7,14,30];
/* g: 0 chưa nhớ, 1 khó nhớ, 2 đã nhớ, 3 rất dễ. Quiz: đúng=2, sai=0 */
function rec(w,g){w.last=now();g>=2?w.ok++:w.bad++;
 w.box=[0,Math.max(1,w.box),Math.min(5,w.box+1),Math.min(5,w.box+2)][g];
 w.next=w.last+(w.box?INT[w.box]*DAY:6e5);DB.put('words',w)}
const isDue=w=>w.last&&w.next<=now();
const setName=id=>(S.sets.find(s=>s.id===id)||{name:''}).name;
function getSet(name){name=(name||'').trim()||'Chưa phân loại';let s=S.sets.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(!s){s={id:uid(),name};S.sets.push(s);DB.put('sets',s)}return s.id}
const startDay=()=>{const d=new Date();d.setHours(0,0,0,0);return+d};

/* ================= Text matching ================= */
const norm=s=>String(s).toLowerCase().normalize('NFC').replace(/[.,!?;:"“”’']/g,'').replace(/\s+/g,' ').trim();
const fold=s=>norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const alts=s=>{const o=new Set();for(const v of [s.replace(/[()]/g,''),s.replace(/\(.*?\)/g,'')])v.split(/[\/;=,]/).forEach(x=>{x=norm(x);x&&o.add(x)});return[...o]};
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function judge(ans,target){const a=norm(ans);if(!a)return'bad';const A=alts(target);if(A.includes(a))return'ok';
 return A.some(x=>x.length>=4&&lev(fold(x),fold(a))<=1)?'near':'bad'} // near = sai dấu / lỗi chính tả nhỏ
const sp=w=>w.en.split(/[=\/]/)[0].replace(/[()]/g,'').trim();

/* ================= Speech ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,TTS='speechSynthesis' in window;
function say(t){if(!TTS)return toast('Trình duyệt không hỗ trợ đọc');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
 u.lang='en-US';u.rate=S.cfg.rate;const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
const spk=w=>`<button class="spk" data-t="${E(sp(w))}" onclick="say(this.dataset.t)">🔊</button>`;

/* ================= Quiz engine ================= */
function scopeList(){const sc=S.cfg.scope;let l=S.words;
 if(sc==='today')l=l.filter(w=>w.added>=startDay());
 else if(sc.startsWith('set:'))l=l.filter(w=>w.set===sc.slice(4));
 else if(sc==='weak')l=l.filter(w=>w.box<3);else if(sc==='wrong')l=l.filter(w=>w.bad>0);else if(sc==='due')l=l.filter(isDue);
 return l}
/* Trọng số: ưu tiên từ sai nhiều / mới / đến hạn, vẫn giữ yếu tố ngẫu nhiên; giảm trọng số từ vừa kiểm tra lần trước */
function wt(w){let x=1+w.bad*2+(!w.last?3:0)+(isDue(w)?3:0)+(w.box<2?1:0);if(S.cfg.recent.includes(w.id))x*=.4;return x}
const pickW=(l,n)=>l.map(w=>[Math.random()**(1/wt(w)),w]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
function typePool(){const t=['e2v','v2e','cloze'];if(S.words.length>=4)t.push('mc','mc');if(TTS)t.push('dict');if(TTS&&S.words.length>=4)t.push('listen');if(SR&&TTS&&!ls.g('vs_nomic'))t.push('speak');return t}
function mkQ(t,w){const q={t,w};
 if(t==='mc'||t==='listen'){q.dir=t==='listen'||Math.random()<.5?'vi':'en';const k=q.key=q.dir==='vi'?'vi':'en';
  const oth=S.words.filter(x=>x.id!==w.id),seen=new Set([w[k]]),d=[];
  for(const x of [...shuffle(oth.filter(x=>x.pos===w.pos)),...shuffle(oth.filter(x=>x.pos!==w.pos))]){if(!seen.has(x[k])){seen.add(x[k]);d.push(x)}if(d.length==3)break}
  if(d.length<3)return mkQ('e2v',w);q.opts=shuffle([w,...d]).map(x=>x[k])}
 return q}
const todayList=()=>S.words.filter(w=>w.added>=startDay());
function startQuiz(sc){if(typeof sc==='string'){S.cfg.scope=sc;saveCfg()}const l=scopeList();
 if(!l.length)return toast(S.cfg.scope==='today'?'Hôm nay chưa thêm từ nào – hãy thêm từ từ ảnh trước':'Không có từ phù hợp phạm vi này');
 const n=S.cfg.n==='all'?l.length:+S.cfg.n,ws=pickW(l,n),pool=typePool();let prev;
 const qs=shuffle(ws).map(w=>{let t;do{t=pool[Math.random()*pool.length|0]}while(t===prev&&new Set(pool).size>1);prev=t;return mkQ(t,w)});
 S.cfg.recent=ws.map(w=>w.id);saveCfg();M={k:'quiz',qs,i:0,res:[],t0:now(),done:false};render()}
function submit(v){const q=M.qs[M.i];if(q.done)return;q.done=true;q.given=v;
 q.r=(q.t==='mc'||q.t==='listen')?(v===q.w[q.key]?'ok':'bad'):judge(v,q.t==='e2v'?q.w.vi:q.w.en);render()}
const chk=()=>submit($('#in').value);
const q_ok=()=>{M.qs[M.i].r='ok';render()};
function skipQ(){const q=M.qs[M.i];q.done=true;q.r='skip';q.given='';nextQ()}
function mic(){const q=M.qs[M.i],r=new SR();r.lang='en-US';r.maxAlternatives=3;$('#heard').textContent='Đang nghe…';
 r.onresult=e=>{const h=[...e.results[0]].map(x=>x.transcript);q.done=true;q.given=h[0];q.r=h.some(x=>alts(q.w.en).includes(norm(x)))?'ok':'bad';render()};
 r.onerror=e=>{const blocked=/not-allowed|service-not-allowed/.test(e.error);if(blocked)ls.s('vs_nomic','1');$('#heard').textContent=blocked?'Micro bị chặn (khung xem trong app Claude không cấp quyền micro, hoặc iOS chưa bật Dictation/Siri). Đã tắt dạng câu luyện phát âm cho các bài sau – nút 🔊 nghe mẫu vẫn dùng được. Hãy bấm “Bỏ qua câu này”.':'Không dùng được micro ('+e.error+'). Bạn có thể bỏ qua câu này.'};
 r.onnomatch=()=>{$('#heard').textContent='Không nghe rõ, thử lại.'};try{r.start()}catch(e){}}
function nextQ(){const q=M.qs[M.i];if(q.r!=='skip'){rec(q.w,q.r==='ok'?2:0);M.res.push(q)}M.i++;
 if(M.i>=M.qs.length){M.done=true;M.secs=Math.round((now()-M.t0)/1000);const c=M.res.filter(q=>q.r==='ok').length;
  const h={id:uid(),date:now(),total:M.res.length,correct:c,secs:M.secs};S.hist.push(h);DB.put('hist',h)}render()}

/* ================= Flashcards ================= */
function startCards(l){if(!l.length)return toast('Không có từ để học hôm nay 🎉');M={k:'cards',q:shuffle(l).map(w=>({w,d:Math.random()<.5})),i:0,flip:false,n:0};render()}
const startToday=()=>startCards([...S.words.filter(isDue),...S.words.filter(w=>!w.last).slice(0,S.cfg.newPerDay)]);
function rate(g){rec(M.q[M.i].w,g);M.i++;M.n++;M.flip=false;render()}
function quit(){if(M&&M.k==='quiz'&&!M.done&&!confirm('Thoát bài kiểm tra? Kết quả sẽ không được lưu.'))return;TTS&&speechSynthesis.cancel();M=null;render()}

/* ================= Views ================= */
let M=null,tab='home',vq='',vset='',vlv='',D=[],pv=[],newW=null;
const V={};
const topbar=()=>`<div class="top"><button class="x" onclick="quit()">✕</button><div class="bar"><i style="width:${M.i/(M.qs||M.q).length*100}%"></i></div><span class="mu">${Math.min(M.i+1,(M.qs||M.q).length)}/${(M.qs||M.q).length}</span></div>`;

V.home=()=>{const tl=todayList().length,due=S.words.filter(isDue).length,mast=S.words.filter(w=>w.box>=4).length;
 const so=[['all','Tất cả từ'],['today','Từ thêm hôm nay'],['weak','Chưa thuộc'],['wrong','Từ từng sai'],['due','Đến hạn ôn'],...S.sets.map(s=>['set:'+s.id,'Bộ: '+s.name])];
 return `<h1>VocabSnap 📖</h1>
 <button class="btn big" onclick="go('add')">📷 Thêm từ vựng từ ảnh</button>
 <div class="grid"><div class="stat"><b>${tl}</b>từ hôm nay</div><div class="stat"><b>${S.words.length}</b>trong kho</div><div class="stat"><b>${mast}</b>đã thuộc</div></div>
 <div class="card"><b>🏫 Trước khi lên lớp</b><small> – chỉ các từ bạn thêm hôm nay</small>
 <div class="row"><button class="btn2" onclick="startCards(todayList())">🃏 Học</button><button class="btn" onclick="startQuiz('today')">🎯 Kiểm tra</button></div></div>
 <div class="card"><b>🗂 Kiểm tra tổng quát</b><small> – toàn bộ kho (${S.words.length} từ, ưu tiên từ yếu)</small>
 <button class="btn" onclick="startQuiz('all')">🎯 Kiểm tra tất cả từ</button>
 <div class="row"><select onchange="S.cfg.scope=this.value;saveCfg()">${sel(so,S.cfg.scope)}</select>
 <select onchange="S.cfg.n=this.value==='all'?'all':+this.value;saveCfg()">${sel([[10,'10 câu'],[20,'20 câu'],[30,'30 câu'],['all','Tất cả']],S.cfg.n)}</select></div>
 <button class="btn2" onclick="startQuiz(S.cfg.scope)">▶ Kiểm tra theo phạm vi đã chọn</button></div>
 <button class="btn2" onclick="startToday()">📚 Ôn từ đến hạn (${due}) + từ mới</button>
 <button class="btn2" onclick="go('vault')">🗂 Mở kho từ vựng</button>`};

V.cards=()=>{const c=M.q[M.i];
 if(!c)return `<div class="card center"><h2>🎉 Xong ${M.n} thẻ</h2><p class="mu">Làm bài kiểm tra để củng cố nhé.</p><button class="btn big" onclick="startQuiz()">🎯 Làm bài kiểm tra</button><button class="btn2" onclick="quit()">Về trang chủ</button></div>`;
 const w=c.w;return topbar()+`<div class="card center" style="min-height:240px" onclick="M.flip=!M.flip;render()"><small>${c.d?'Anh → Việt':'Việt → Anh'}${w.flag?' · ⚠️ cần kiểm tra':''}</small>
 <div class="big">${E(c.d?w.en:w.vi)}</div>${M.flip?`<hr><div class="big2">${E(c.d?w.vi:w.en)}</div><div class="ipa">${E(w.ipa)} ${w.pos?'('+E(w.pos)+')':''}</div>${w.ex?`<p class="mu">${E(w.ex)}</p>`:''}`:'<p class="mu">Chạm để lật thẻ</p>'}</div>
 <div class="center">${spk(w)} <small>Nghe</small></div>`+(M.flip?`<div class="row"><button class="btn2" onclick="rate(0)">Chưa nhớ</button><button class="btn2" onclick="rate(1)">Khó nhớ</button></div><div class="row"><button class="btn" onclick="rate(2)">Đã nhớ</button><button class="btn" onclick="rate(3)">Rất dễ</button></div>`:'')};

V.quiz=()=>{const q=M.qs[M.i],w=q.w,t=q.t,d=q.done;let lab,head='',body='';
 const inp=ph=>`<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" ${d?'disabled':''} value="${d?E(q.given):''}" onkeydown="if(event.key==='Enter')chk()">${d?'':'<button class="btn" onclick="chk()">Kiểm tra</button>'}`;
 const opts=()=>q.opts.map(o=>`<button class="opt ${d?(o===w[q.key]?'ok':o===q.given?'bad':''):''}" ${d?'disabled':''} data-v="${E(o)}" onclick="submit(this.dataset.v)">${E(o)}</button>`).join('');
 const base=w.en.replace(/\(.*?\)/g,'').split(/[=\/]/)[0].trim();
 if(t==='e2v'){lab='Nghĩa tiếng Việt là gì?';head=`<div class="big">${E(w.en)}</div>`;body=inp('Nhập nghĩa…')}
 else if(t==='v2e'){lab='Từ / cụm từ tiếng Anh là gì?';head=`<div class="big">${E(w.vi)}</div>`;body=inp('Nhập tiếng Anh…')}
 else if(t==='cloze'){lab='Điền từ còn thiếu';head=`<div class="big" style="letter-spacing:2px">${E(base.split(' ').map(x=>x[0]+' _'.repeat(x.length-1)).join('   '))}</div><p class="mu">Nghĩa: ${E(w.vi)}</p>`;body=inp('Nhập từ còn thiếu…')}
 else if(t==='mc'){lab=q.dir==='vi'?'Chọn nghĩa đúng':'Chọn từ tiếng Anh đúng';head=`<div class="big">${E(q.dir==='vi'?w.en:w.vi)}</div>`;body=opts()}
 else if(t==='listen'){lab='Nghe và chọn nghĩa đúng';head=`<div class="big"><button class="spk" style="font-size:44px" data-t="${E(sp(w))}" onclick="say(this.dataset.t)">🔊</button></div>`;body=opts()}
 else if(t==='dict'){lab='Nghe và viết lại (chính tả)';head=`<div class="big"><button class="spk" style="font-size:44px" data-t="${E(sp(w))}" onclick="say(this.dataset.t)">🔊</button></div>`;body=inp('Gõ từ bạn nghe được…')}
 else{lab='Luyện phát âm';head=`<div class="big">${E(w.en)}</div><div class="ipa">${E(w.ipa)}</div>${spk(w)}`;body=d?'':`<button class="mic" onclick="mic()">🎤 Nhấn để đọc</button><div id="heard" class="mu center"></div><button class="lnk" onclick="skipQ()">Bỏ qua câu này</button>`}
 const fb=d?`<div class="fb ${q.r}"><b>${q.r==='ok'?'✅ Chính xác':q.r==='near'?'🟡 Gần đúng (sai dấu / lỗi chính tả nhỏ)':'❌ Chưa đúng'}</b><div>Đáp án: <b>${E(w.en)}</b> <span class="ipa">${E(w.ipa)}</span> ${spk(w)}</div><div>${E(w.vi)}</div>
 ${t==='speak'?`<small>Hệ thống nghe được: “${E(q.given)}”. Nhận diện khớp chưa chắc là phát âm chuẩn.</small>`:''}
 <div class="row">${q.r!=='ok'?'<button class="btn2" onclick="q_ok()">Tính là đúng</button>':''}<button class="btn" onclick="nextQ()">${M.i+1>=M.qs.length?'Xem kết quả':'Tiếp →'}</button></div></div>`:'';
 return topbar()+`<div class="card"><small>${lab}</small>${head}${body}${fb}</div>`};

V.sum=()=>{const r=M.res,c=r.filter(q=>q.r==='ok').length,wr=r.filter(q=>q.r!=='ok');
 return `<h1>Kết quả 🏁</h1><div class="grid"><div class="stat"><b>${c}/${r.length}</b>đúng</div><div class="stat"><b>${r.length?Math.round(c/r.length*100):0}%</b>chính xác</div><div class="stat"><b>${Math.floor(M.secs/60)}:${String(M.secs%60).padStart(2,'0')}</b>thời gian</div></div>
 <button class="btn big" onclick="startQuiz()">🔄 Làm bài mới</button><button class="btn2" onclick="quit()">Về trang chủ</button>
 <div class="card"><b>${wr.length?'Từ cần ôn lại ('+wr.length+')':'Hoàn hảo, không có từ sai! 🎉'}</b>${wr.map(q=>`<div class="w"><div><b>${E(q.w.en)}</b> <span class="ipa">${E(q.w.ipa)}</span><br>${E(q.w.vi)}</div>${spk(q.w)}</div>`).join('')}</div>`};

V.vault=()=>`<h1>Kho từ vựng</h1><input placeholder="🔍 Tìm tiếng Anh / tiếng Việt" value="${E(vq)}" oninput="vq=this.value;renderList()">
 <div class="row"><select onchange="vset=this.value;render()">${sel([['','Tất cả bộ'],...S.sets.map(s=>[s.id,s.name])],vset)}</select>
 <select onchange="vlv=this.value;renderList()">${sel([['','Mọi mức'],['today','Thêm hôm nay'],['new','Chưa học'],['learn','Đang học'],['mastered','Đã thuộc']],vlv)}</select></div>
 <div class="row"><button class="btn2" onclick="edit()">＋ Thêm từ</button>${vset?'<button class="btn2" onclick="delSet()">🗑 Xóa bộ này</button>':''}</div>
 <small id="cnt"></small><div id="wl"></div>`;
function renderList(){const q=fold(vq),L=S.words.filter(w=>(!vset||w.set===vset)&&(!q||fold(w.en+' '+w.vi).includes(q))&&(!vlv||(vlv==='today'?w.added>=startDay():vlv==='new'?!w.last:vlv==='mastered'?w.box>=4:w.last&&w.box<4)));
 const col=['#9ca3af','#ef4444','#f59e0b','#eab308','#22c55e','#16a34a'];
 $('#wl').innerHTML=L.length?L.map(w=>`<div class="w"><div><span class="dot" style="background:${w.last?col[w.box]:col[0]}"></span><b>${E(w.en)}</b> <small>${E(w.pos)}</small> ${w.flag?'⚠️':''}<br><span class="ipa">${E(w.ipa)}</span><br>${E(w.vi)}</div><div style="white-space:nowrap">${spk(w)}<button class="spk" onclick="edit('${w.id}')">✏️</button></div></div>`).join(''):'<p class="mu">Chưa có từ nào. Hãy thêm ở tab “Nhập”.</p>';
 $('#cnt').textContent=L.length+' từ'}
function edit(id){const w=id?S.words.find(x=>x.id===id):mkWord({set:vset});newW=w;
 $('#f-en').value=w.en;$('#f-ipa').value=w.ipa;$('#f-vi').value=w.vi;$('#f-pos').value=w.pos;$('#f-ex').value=w.ex;$('#f-set').value=setName(w.set);
 $('#sets').innerHTML=S.sets.map(s=>`<option value="${E(s.name)}">`).join('');$('#del').style.display=id?'':'none';$('#dlg').showModal()}
function saveW(){const w=newW;w.en=$('#f-en').value.trim();w.ipa=$('#f-ipa').value.trim();w.vi=$('#f-vi').value.trim();w.pos=$('#f-pos').value.trim();w.ex=$('#f-ex').value.trim();
 if(!w.en||!w.vi)return toast('Cần có từ tiếng Anh và nghĩa');w.set=getSet($('#f-set').value);w.flag=false;
 if(!S.words.includes(w))S.words.push(w);DB.put('words',w);$('#dlg').close();render()}
function delW(){if(!confirm('Xóa từ “'+newW.en+'”?'))return;S.words=S.words.filter(x=>x!==newW);DB.del('words',newW.id);$('#dlg').close();render()}
function delSet(){const n=S.words.filter(w=>w.set===vset).length;if(!confirm(`Xóa bộ “${setName(vset)}” và ${n} từ trong bộ? Không thể hoàn tác.`))return;
 S.words.filter(w=>w.set===vset).forEach(w=>DB.del('words',w.id));S.words=S.words.filter(w=>w.set!==vset);DB.del('sets',vset);S.sets=S.sets.filter(s=>s.id!==vset);vset='';render()}

/* ---- Nhập: ảnh (OCR) / dán / thủ công → bảng xác nhận → lưu ---- */
V.add=()=>`<h1>Nhập từ vựng</h1><div class="card"><b>📷 Từ ảnh bài giảng</b>
 <div class="drop" id="drop" onclick="$('#fi').click()">Chọn ảnh hoặc kéo thả vào đây<input id="fi" type="file" accept="image/*" multiple hidden onchange="pick(this.files)"></div>
 <div class="pv" id="pv"></div><button class="btn" onclick="ocr()">🔍 Đọc ảnh bằng Claude</button><small id="st">Claude đọc bảng trong ảnh và điền vào bảng xác nhận bên dưới. Chỉ ảnh bạn chọn được gửi đi, và chỉ khi bạn bấm nút này. Luôn kiểm tra lại trước khi lưu.</small></div>
 <div class="card"><b>📋 Dán danh sách</b><small> – mỗi dòng: English | IPA | Vietnamese (ngăn bằng Tab, | hoặc ;)</small>
 <textarea id="paste" placeholder="manager (n) | /ˈmænɪdʒə(r)/ | quản lý"></textarea><button class="btn2" onclick="addLines($('#paste').value,false);$('#paste').value=''">Phân tích danh sách</button></div>
 <div class="card"><b>✅ Xác nhận trước khi lưu</b><input id="sname" placeholder="Tên bộ, vd: TOEIC Reading Unit 1" value="${E(vset?setName(vset):'')}"><div id="dr"></div>
 <button class="btn2" onclick="D.push({en:'',ipa:'',vi:'',pos:'',sel:true});renderDraft()">＋ Thêm hàng</button><button class="btn" onclick="saveDraft()">💾 Lưu các từ đã chọn</button></div>`;
const splitPos=s=>{const m=s.match(/\s*\((n|v|adj|adv|phr|prep)[()]?\s*$/i);return m?{t:s.slice(0,m.index).trim(),pos:m[1].toLowerCase()}:{t:s,pos:''}};
function parseLine(l){l=l.trim();if(!l)return null;let en,ipa='',vi='';const m=l.match(/\/[^\/]{2,}\/(?:\s*\/[^\/]{2,}\/)?/);
 if(m){en=l.slice(0,m.index);ipa=m[0];vi=l.slice(m.index+m[0].length)}
 else{const p=l.split(/\t|\||;|\s{2,}/).map(s=>s.trim()).filter(Boolean);if(p.length>=3)[en,ipa,vi]=p;else if(p.length==2)[en,vi]=p;else en=l}
 const {t,pos}=splitPos(en.trim());return{en:t,ipa:ipa.trim(),vi:vi.trim(),pos,sel:true}}
function addRows(rows){const n0=D.length;rows.forEach(r=>{if(r&&r.en&&String(r.en).trim())D.push({en:String(r.en).trim(),ipa:String(r.ipa||'').trim(),vi:String(r.vi||'').trim(),pos:String(r.pos||'').trim(),sel:true,flag:!!r.flag||!r.vi})});
 const ex=new Set(S.words.map(w=>w.en.toLowerCase()));D.forEach(r=>{if(ex.has(r.en.toLowerCase()))r.sel=false});renderDraft();
 const n=D.length-n0;toast(n?`Đã thêm ${n} dòng vào bảng xác nhận`:'Không đọc được dòng nào')}
function addLines(txt){addRows(txt.split('\n').map(parseLine))}
function renderDraft(){const el=$('#dr');if(!el)return;const ex=new Set(S.words.map(w=>w.en.toLowerCase())),seen=new Set();
 el.innerHTML=D.length?D.map((r,i)=>{const k=r.en.toLowerCase(),dup=k&&(ex.has(k)||seen.has(k));seen.add(k);
 return `<div class="dr ${r.flag?'fl':''}"><div class="row" style="align-items:center"><input type="checkbox" ${r.sel?'checked':''} onchange="D[${i}].sel=this.checked"><input style="flex:5" value="${E(r.en)}" placeholder="English" oninput="ed(${i},'en',this.value)"><button class="x" style="flex:none" onclick="D.splice(${i},1);renderDraft()">🗑</button></div>
 <input value="${E(r.ipa)}" placeholder="IPA" oninput="ed(${i},'ipa',this.value)"><div class="row"><input style="flex:4" value="${E(r.vi)}" placeholder="Nghĩa tiếng Việt" oninput="ed(${i},'vi',this.value)"><input value="${E(r.pos)}" placeholder="loại" oninput="ed(${i},'pos',this.value)"></div>
 ${dup?'<small class="warn">⚠ Trùng từ đã có / đã nhập</small>':''}${r.flag?'<small class="warn"> · Chưa chắc chắn – hãy kiểm tra</small>':''}</div>`}).join(''):'<p class="mu">Chưa có dữ liệu. Tải ảnh, dán danh sách hoặc thêm hàng.</p>'}
const ed=(i,k,v)=>{D[i][k]=v;D[i].flag=false};
function saveDraft(){const rows=D.filter(r=>r.sel&&r.en.trim()&&r.vi.trim());if(!rows.length)return toast('Chưa có từ hợp lệ nào được chọn (cần English + Vietnamese)');
 const sid=getSet($('#sname').value);rows.forEach(r=>{const w=mkWord({en:r.en.trim(),ipa:r.ipa.trim(),vi:r.vi.trim(),pos:r.pos.trim(),set:sid,flag:!!r.flag});S.words.push(w);DB.put('words',w)});
 D=D.filter(r=>!rows.includes(r));toast(`Đã lưu ${rows.length} từ vào kho. Bấm “Kiểm tra” để thử ngay!`);go('home')}
function pick(fs){const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r('');x.readAsDataURL(f)});
 Promise.all([...fs].filter(f=>f.type.startsWith('image/')).map(async f=>pv.push({file:f,url:await rd(f)}))).then(renderPv)}
const renderPv=()=>{const e=$('#pv');if(e)e.innerHTML=pv.map((p,i)=>`<div><img src="${p.url}"><br><button class="lnk" onclick="pv.splice(${i},1);renderPv()">Bỏ</button></div>`).join('')};
async function shrink(f){const im=await createImageBitmap(f),k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
const PROMPT=`Ảnh là bảng từ vựng tiếng Anh gồm các cột English | Pronunciation | Vietnamese (có thể kèm thanh trạng thái điện thoại, bỏ qua).
Trích xuất TỪNG hàng của bảng, chép CHÍNH XÁC theo ảnh: không sửa nghĩa, không sửa phiên âm, không tự thêm từ.
- en: từ/cụm từ tiếng Anh, bỏ phần từ loại trong ngoặc như (n), (v), (adj), (phr)
- pos: từ loại lấy từ ngoặc đó (n, v, adj, phr...), nếu không có thì ""
- ipa: phiên âm nguyên văn, giữ cả dấu /.../
- vi: nghĩa tiếng Việt nguyên văn
- unsure: true nếu hàng bị mờ/cắt/có vẻ sai chính tả trong ảnh, ngược lại false
Chỉ trả về một mảng JSON, không giải thích: [{"en":"","pos":"","ipa":"","vi":"","unsure":false}]`;
async function ocr(){if(!pv.length)return toast('Chưa chọn ảnh');const st=$('#st');
 const sm=window.claude?await claude.use('sample'):null;
 if(!sm){st.textContent='Đọc ảnh chỉ chạy khi mở trang qua link trong ứng dụng Claude. Tạm thời hãy dùng “Dán danh sách” hoặc nhập tay.';return}
 try{for(let i=0;i<pv.length;i++){st.textContent=`Đang đọc ảnh ${i+1}/${pv.length}… (có thể mất tới 1 phút)`;
   const out=await sm.json(PROMPT,{images:[await shrink(pv[i].file)],modelTier:'default'});
   addRows((Array.isArray(out)?out:out.rows||[]).map(r=>({...r,flag:!!r.unsure})))}
  pv=[];renderPv();st.textContent='Xong. Kiểm tra bảng bên dưới (dòng ⚠️ là chỗ chưa chắc), sửa nếu cần rồi bấm Lưu.'}
 catch(e){st.textContent='Không đọc được ảnh ('+(e.code||e.message||'lỗi')+'). '+(e.code==='not_granted'?'Bạn cần cho phép dùng Claude khi được hỏi.':'Thử lại hoặc dùng “Dán danh sách”.')}}

V.stats=()=>{const ok=S.words.reduce((a,w)=>a+w.ok,0),bad=S.words.reduce((a,w)=>a+w.bad,0),bx=[0,1,2,3,4,5].map(i=>S.words.filter(w=>w.last&&w.box===i).length),nw=S.words.filter(w=>!w.last).length,mx=Math.max(1,nw,...bx);
 return `<h1>Thống kê</h1><div class="grid"><div class="stat"><b>${ok+bad?Math.round(ok/(ok+bad)*100):0}%</b>đúng tổng</div><div class="stat"><b>${S.hist.length}</b>bài kiểm tra</div><div class="stat"><b>${nw}</b>từ mới</div></div>
 <div class="card"><b>Mức ghi nhớ</b>${[['Chưa học',nw],...bx.map((n,i)=>['Hộp '+i+(i?' · ôn '+INT[i]+' ngày':' · sai'),n])].map(([l,n])=>`<div><small>${l}: ${n}</small><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`).join('')}</div>
 <div class="card"><b>Lịch sử kiểm tra</b>${[...S.hist].reverse().slice(0,10).map(h=>`<div class="w"><span>${new Date(h.date).toLocaleString('vi-VN')}</span><b>${h.correct}/${h.total}</b></div>`).join('')||'<p class="mu">Chưa có.</p>'}</div>

 <small> Tốc độ giọng đọc</small><input type="range" min=".5" max="1.2" step=".1" value="${S.cfg.rate}" onchange="S.cfg.rate=+this.value;saveCfg();say('Hello')">

 <button class="btn2" onclick="ls.s('vs_nomic','');toast('Đã bật lại câu luyện phát âm')">🎤 Bật lại câu luyện phát âm</button><button class="btn2" onclick="loadSample()">🧪 Nạp dữ liệu mẫu (TOEIC Reading Unit 1)</button><button class="btn2" style="color:var(--bad)" onclick="resetAll()">🗑 Xóa toàn bộ dữ liệu</button>
 <small>Dữ liệu lưu trong IndexedDB của trình duyệt này. Xuất sao lưu định kỳ.<br>Micro: ${SR?'có hỗ trợ':'trình duyệt không hỗ trợ nhận diện giọng nói'} · Đọc mẫu: ${TTS?'có':'không'}</small></div>`};
function exp(){dl(new Blob([JSON.stringify({v:1,words:S.words,sets:S.sets,hist:S.hist},null,1)],{type:'application/json'}),'vocabsnap-backup-'+new Date().toISOString().slice(0,10)+'.json')}
